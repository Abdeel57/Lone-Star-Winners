# ---------------------------------------------------------------------------
# Lone Star Winners - hooks de Git (lefthook)
#
# Propietario: security-integration.
# DEC-018: gitleaks con hook de pre-commit.
#
# ACTIVACION: automatica. `lefthook` es devDependency de la raiz y el script
# `prepare` ejecuta `lefthook install`, asi que los hooks se instalan solos al
# clonar e instalar dependencias (HO-008, resuelto por backend-sweepstakes).
#
# ---------------------------------------------------------------------------
# REGLA DE ORO DE ESTE FICHERO: EN `run:` NO SE ESCRIBEN COMILLAS DOBLES
# ---------------------------------------------------------------------------
# No es una preferencia de estilo. En Windows, un `run: |` que contenga una
# comilla doble NO SE EJECUTA ENTERO: se trunca en silencio.
#
#   1. lefthook (Go) lanza el job como exec.Command("bash", "-c", script).
#   2. Windows no tiene argv: Go serializa los argumentos en UNA sola linea de
#      comandos con syscall.EscapeArg, que envuelve el script en comillas
#      dobles y escapa cada comilla interna del script como \".
#   3. bash.exe de Git Bash es un binario MSYS2 y reparsea esa linea con SUS
#      reglas, que no honran el \" de Go: la comilla escapada CIERRA la region
#      entrecomillada en vez de ser un caracter literal.
#   4. Desde ese punto, el primer espacio que estaba DENTRO de unas comillas
#      del script original se convierte en separador de argumentos. El script
#      queda cortado ahi y el resto llega a bash como $0, $1... sin ejecutar.
#
# Sintoma que dejo este fichero antes de la correccion:
#
#   no: -c: line 8: syntax error: unexpected end of file
#
# donde el supuesto shell llamado `no` era la palabra que seguia a
# `echo "gitleaks` una vez rota la linea de comandos.
#
# Y lo importante: el error de sintaxis es el caso AFORTUNADO. El corte cae
# donde caiga la primera comilla, y si el fragmento superviviente es
# sintacticamente valido el job termina en 0 sin haber comprobado nada, con su
# check verde. Medido en banco de pruebas con lefthook 1.13.6:
#
#   run: |
#     echo "AAA BBB"
#     echo "CCC DDD"
#     echo EEE
#
#   -> imprime solo `AAA`, no ejecuta las otras dos lineas, y sale con 0.
#
# Un gate que no revienta no esta necesariamente funcionando: puede estar
# ciego. Por eso la logica real vive en .lefthook/<hook>/*.sh -donde un
# script de shell puede usar comillas y por tanto ser correcto- y aqui solo
# queda la invocacion, sin una sola comilla doble.
# ---------------------------------------------------------------------------

min_version: 1.7.0

pre-commit:
  parallel: true
  jobs:
    # -----------------------------------------------------------------------
    # 1. Secretos en lo que se esta a punto de commitear.
    #    Falla en cerrado si gitleaks no esta disponible: ver el script.
    # -----------------------------------------------------------------------
    - name: gitleaks
      run: bash .lefthook/pre-commit/gitleaks.sh

    # -----------------------------------------------------------------------
    # 2. Ningun .env real, clave privada o credencial en el commit.
    #    Es la misma comprobacion que hace CI, adelantada al pre-commit.
    #    Sin `glob`: un gate de secretos debe ejecutarse en todos los commits,
    #    y el script ya calcula por su cuenta los ficheros staged.
    # -----------------------------------------------------------------------
    - name: no-secret-files
      run: bash .lefthook/pre-commit/no-secret-files.sh

    # -----------------------------------------------------------------------
    # 3. Formato. DEC-016 y DEC-026: un CRLF o un fichero sin formatear cambia
    #    el hash de artefactos que un tercero debe poder reproducir.
    #
    #    Este job si usa {staged_files} y sobrevive en Windows porque su `run`
    #    no contiene ni una comilla doble (lefthook entrecomilla con comillas
    #    simples las rutas con espacios, y esas si atraviesan intactas la linea
    #    de comandos). No anadas comillas dobles aqui.
    # -----------------------------------------------------------------------
    - name: prettier
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs,json,jsonc,md,mdx,yml,yaml,css}"
      run: pnpm exec prettier --check {staged_files}

pre-push:
  parallel: false
  jobs:
    # El pre-push mira el historial completo, no solo lo que se acaba de
    # escribir: un secreto commiteado hace tres commits sigue estando ahi.
    - name: gitleaks-historial
      run: bash .lefthook/pre-push/gitleaks-history.sh
